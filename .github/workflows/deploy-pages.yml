name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data (schema + referential integrity + privacy rules)
        run: npm run data:validate

      - name: Source regression tests
        run: npm run test:data

      - name: Geocoding regression tests
        run: npm run test:geo

      - name: Map regression tests
        run: npm run test:map-layout && npm run test:map-wheel && npm run test:amap

      - name: Deployment path regression tests
        run: node --test tests/deployment-config.test.mjs

      - name: Build static export (custom domain root)
        run: |
          : "${NEXT_PUBLIC_AMAP_JS_KEY:?Configure the Amap JS Key repository secret}"
          : "${NEXT_PUBLIC_AMAP_SERVICE_HOST:?Configure the Amap serviceHost repository variable}"
          npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: ''
          # The security code belongs to the external proxy, never to this static build.
          NEXT_PUBLIC_AMAP_JS_KEY: ${{ secrets.NEXT_PUBLIC_AMAP_JS_KEY }}
          NEXT_PUBLIC_AMAP_SERVICE_HOST: ${{ vars.NEXT_PUBLIC_AMAP_SERVICE_HOST }}

      - name: Typecheck generated routes
        run: npm run typecheck

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
