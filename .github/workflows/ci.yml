name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate data
        run: npm run data:validate

      - name: Source regression tests
        run: npm run test:data

      - name: Geocoding regression tests
        run: npm run test:geo

      - name: Map regression tests
        run: npm run test:map-layout && npm run test:map-wheel && npm run test:amap

      - name: Build (with GitHub Pages basePath)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Typecheck generated routes
        run: npm run typecheck
