name: A11y spec (advisory)

# 设计断言的整站走查，只做参考，不进 required。
# 在 pull_request 上跑：改动合并前就能看见红项；合并后不再重复跑，发布仍由 deploy-pages 负责。
on:
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: spec (${{ matrix.viewport }})
    runs-on: ubuntu-latest
    # 单档约 10 分钟（build 3–4 分钟 + 装 chromium + 跑断言）。这里的 25 分钟是「每个 job 自己的保险丝」，
    # 不是把原来 20 分钟的总门槛放宽：一个 job 只跑一档，保险丝挡的是单档卡死；
    # 四档谁红了谁自己红，不再出现「前几档跑完、后几档被总超时挤掉」的取消。
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - viewport: 1440x900
            slug: ci-1440
          - viewport: 390x844
            slug: ci-390
          - viewport: 375x812
            slug: ci-375
          - viewport: 320x568
            slug: ci-320
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: ''

      # runner 在步骤结束时可能收掉整个进程组，所以服务要脱离当前会话（nohup + setsid），
      # 否则后面的 step 会撞 connection refused。
      - name: Serve out/ on 4177
        run: |
          nohup setsid node scripts/preview.ts --port 4177 > /tmp/preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4177/ > /dev/null; then
              echo "preview up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "preview did not start"
          cat /tmp/preview.log
          exit 1

      - name: Install playwright for the spec runner
        run: |
          npm i --no-save --prefix .ci playwright@1.63.0
          .ci/node_modules/.bin/playwright install --with-deps chromium

      # sha 是用来对表的，所以写进 job summary（日志要人翻，summary 在 PR 页面上直接可见）。
      # 四档并行会各写一遍同样的表，只在 1440 那个 job 写一次。
      - name: Snapshot provenance
        if: matrix.viewport == '1440x900'
        run: |
          node - <<'NODE'
          const crypto = require('crypto')
          const fs = require('fs')
          const rows = []
          for (const file of ['tools/a11y/spec.cjs', 'tools/a11y/ui-spec.json']) {
            const bytes = fs.readFileSync(file)
            const sha = crypto.createHash('sha256').update(bytes).digest('hex').slice(0, 16)
            const count = file.endsWith('ui-spec.json') ? JSON.parse(bytes.toString('utf8')).checks.length : '—'
            rows.push(`| \`${file}\` | ${bytes.length} | \`${sha}\` | ${count} |`)
            console.log(`${file}\t${bytes.length} bytes\tsha256:${sha}`)
          }
          const summary = [
            '### a11y 快照（CI 跑的就是这两份）',
            '',
            '| 文件 | 字节 | sha256:前16 | 断言数 |',
            '| --- | --- | --- | --- |',
            ...rows,
            '',
            '与 `tools/a11y/README.md` 表里的值不一致，说明快照没重做。',
            '',
          ].join('\n')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n')
          NODE

      - name: Spec at ${{ matrix.viewport }}
        env:
          NODE_PATH: ${{ github.workspace }}/.ci/node_modules
        run: |
          # 上一步的服务若被 runner 收掉，这里就地重启，不让它变成一条「connection refused」的假红。
          if ! curl -fsS http://127.0.0.1:4177/ > /dev/null; then
            nohup setsid node scripts/preview.ts --port 4177 > /tmp/preview.log 2>&1 &
            for attempt in $(seq 1 40); do
              curl -fsS http://127.0.0.1:4177/ > /dev/null && break
              sleep 1
            done
          fi
          mkdir -p reports/a11y
          node tools/a11y/spec.cjs http://127.0.0.1:4177/ tools/a11y/ui-spec.json \
            --viewports ${{ matrix.viewport }} --out reports/a11y --name ${{ matrix.slug }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-spec-${{ matrix.viewport }}
          path: reports/a11y
          if-no-files-found: warn
