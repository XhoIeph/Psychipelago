name: A11y spec (advisory)

# 设计断言的整站走查，只做参考，不进 required。
# 在 pull_request 上跑：改动合并前就能看见红项；合并后不再重复跑，发布仍由 deploy-pages 负责。
on:
  pull_request:
  # absent 分支在正常 PR 里永远跑不到：有了 key，CI 每轮都是 present，12 / 13 那套条数只是躺在代码里。
  # 留两个入口，让无 key 那套每周真跑一次，条数或门控漂了才看得见。
  workflow_dispatch:
    inputs:
      mode:
        description: 'absent = 故意不给 key，验地图缺席那套；present = 照常跑四档'
        type: choice
        options: [absent, present]
        default: absent
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  spec:
    name: spec (${{ matrix.viewport }})
    # 定期或手动 absent 演练时不跑这一支，免得同一轮里一边给 key 一边不给。
    if: github.event_name == 'pull_request' || inputs.mode == 'present'
    runs-on: ubuntu-latest
    # 单档约 10 分钟（build 3–4 分钟 + 装 chromium + 跑断言）。这里的 25 分钟是「每个 job 自己的保险丝」，
    # 不是把原来 20 分钟的总门槛放宽：一个 job 只跑一档，保险丝挡的是单档卡死；
    # 四档谁红了谁自己红，不再出现「前几档跑完、后几档被总超时挤掉」的取消。
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - viewport: 1440x900
            slug: ci-1440
          - viewport: 390x844
            slug: ci-390
          - viewport: 375x812
            slug: ci-375
          - viewport: 320x568
            slug: ci-320
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 地图 Key 与 deploy-pages.yml 用同一个仓库 secret。两条路径必须在跑之前分开，不靠「跑了失败再判」：
      # - present（同仓 PR / push）：secret 在。缺了它 lib/amap-loader.ts 直接 reject，页面根本没有 window.AMap，
      #   所以这里 `:?` 硬失败——配置缺了要响，不能静默变成一堆不适用。
      # - absent（fork PR 拿不到 secret）：先定 A11Y_MAP_STATE=absent 并打警告，地图断言按不适用计，
      #   非地图断言照旧全跑且必须全绿。这一支不参与 na-budget 的白名单判定（见文件末尾那个 job）。
      - name: Resolve map key state
        run: |
          if [ -n "${NEXT_PUBLIC_AMAP_JS_KEY:-}" ]; then
            echo "A11Y_MAP_STATE=present" >> "$GITHUB_ENV"
            echo "地图状态：present（key 已注入，地图断言会真跑）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A11Y_MAP_STATE=absent" >> "$GITHUB_ENV"
            echo "地图状态：absent（无 key，地图相关断言记不适用）" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::未拿到 NEXT_PUBLIC_AMAP_JS_KEY（fork PR 或 secret 缺失）：地图断言记不适用，非地图断言照旧全跑"
          fi
        env:
          NEXT_PUBLIC_AMAP_JS_KEY: ${{ secrets.NEXT_PUBLIC_AMAP_JS_KEY }}

      # 这里不设 NEXT_PUBLIC_AMAP_SERVICE_HOST：留空时 bundle 走 127.0.0.1 的 /_AMapService，正由下个 step 的 preview.ts 代跑。
      - name: Build static site
        run: |
          if [ "$A11Y_MAP_STATE" = present ]; then
            : "${NEXT_PUBLIC_AMAP_JS_KEY:?present 分支要求 NEXT_PUBLIC_AMAP_JS_KEY 已注入；secret 缺失就不能假装在验地图}"
          fi
          npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_AMAP_JS_KEY: ${{ secrets.NEXT_PUBLIC_AMAP_JS_KEY }}

      # runner 在步骤结束时可能收掉整个进程组，所以服务要脱离当前会话（nohup + setsid），
      # 否则后面的 step 会撞 connection refused。
      - name: Serve out/ on 4177
        run: |
          nohup setsid node scripts/preview.ts --port 4177 > /tmp/preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4177/ > /dev/null; then
              echo "preview up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "preview did not start"
          cat /tmp/preview.log
          exit 1

      # 出网诊断，只写 summary，不参与定档。理由见下面那个运行时探测：curl 200 只说明这台 runner
      # 能连到 SDK 域名，说明不了浏览器里地图能不能挂上层级——实测这一行常年 200 而地图没起。
      - name: AMap egress probe
        continue-on-error: true
        run: |
          set +e
          url='https://webapi.amap.com/maps?v=2.0'
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" 2>/tmp/amap-curl.err)
          rc=$?
          err=$(tr '\n' ' ' < /tmp/amap-curl.err | cut -c1-160)
          echo "probe url=$url curl_exit=$rc http_code=$code err=$err"
          {
            echo ''
            echo '### AMap SDK 出网探测'
            echo ''
            echo '| 档 | curl 退出码 | HTTP | 错误 |'
            echo '| --- | --- | --- | --- |'
            echo "| \`${{ matrix.viewport }}\` | $rc | $code | ${err:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install playwright for the spec runner
        run: |
          npm i --no-save --prefix .ci playwright@1.63.0
          # 系统依赖走 apt，runner 侧 DNS 一坏就会卡几分钟甚至挂到超时。
          # 所以给 apt 三分钟上限，装不上只记一条 warning 继续：ubuntu-latest 自带
          # chromium 需要的共享库和常用字体，浏览器本身从 playwright CDN 下，不经 apt。
          timeout 180 .ci/node_modules/.bin/playwright install-deps chromium \
            || echo "::warning::系统依赖没装全（apt 慢或不可达），继续只下浏览器"
          .ci/node_modules/.bin/playwright install chromium

      # 真正的定档：拿同一个 chromium 打开 /map/，看首屏到底画出来没有。
      # 判据只用画布的 `inert` 与 `opacity`（就绪后 inert 去掉、opacity 回 1）。
      # 不能用 `.amap-layers`（瓦片不通时它照样是 1）、`.tc-map-loading`（正常与失败都归零）、
      # 也不能用 `window.AMap`（SDK 本体到了但瓦片没到，它仍是 object）。
      # 探不出来就降 absent：地图门控宁写「没验」，不写「验过了」。降档只影响地图域断言，非地图断言照旧全跑。
      - name: Probe map runtime
        env:
          NODE_PATH: ${{ github.workspace }}/.ci/node_modules
          # 每个 job 探自己那一档：写死桌面档，手机档真出问题时会把根因归到错误的地方。
          PROBE_VIEWPORT: ${{ matrix.viewport }}
        run: |
          set +e
          # 已经是 absent（fork PR 没 key）就不必再探：结论不会变，白花三十秒。
          if [ "$A11Y_MAP_STATE" != present ]; then
            echo '地图状态已是 absent，跳过运行时探测' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node - <<'NODE' > /tmp/probe-map.log 2>&1
          const { chromium } = require('playwright')
          const [width, height] = String(process.env.PROBE_VIEWPORT || '1440x900').split('x').map(Number)
          // 瓦片域的实际响应是判断「出网不通」还是「闸有毛病」的唯一依据。
          // 裸请求这些 URL 一定 403（票是 SDK 按会话签的），所以只看带票的真实响应。
          const TILE = /(jsapi-data\d*|webst\d*|wprd\d*|webrd\d*)\.amap\.com/i
          const AMAP = /(^|\.)amap\.com$/i
          ;(async () => {
            const browser = await chromium.launch()
            // 高德按 UA 判平台：Linux 的 UA 一律降级到 DomRender，而 DomRender 在本站 25 秒内画不出底图。
            // runner 全是 Linux，所以探针报一个桌面 Windows 的 UA，测的才是「浏览器能不能画」。
            const DESKTOP_UA =
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'
            const page = await browser.newPage({ viewport: { width, height }, userAgent: DESKTOP_UA })
            let ready = false
            let seen = 'no-canvas'
            let error = ''
            let glInfo = {}
            const tiles = { asked: 0, ok: 0, bad: 0, failed: 0, firstBad: '' }
            // 按域统计所有高德请求：瓦片数为零时，要看得出 SDK 到底走到哪一步——
            // 只有 webapi/jsapi 说明脚本到了但没进渲染，连它们都没有说明脚本没到。
            const hosts = {}
            // 发出去但没回来的请求也要数：只有「问了没人答」才能证明是出网，而不是 SDK 没问。
            const sent = {}
            // 把前几条高德响应体截一小段带出来：key 被域名白名单拒时，答案在响应里而不在计数里。
            const bodies = []
            const referers = new Set()
            // 高德自己选哪个渲染器（WebGLRender / DomRender）决定了它会不会去要瓦片。
            const renderers = new Set()
            const note = (url, status) => {
              const host = new URL(url).host
              const row = hosts[host] || (hosts[host] = { ok: 0, bad: 0 })
              if (status === 200) row.ok += 1
              else row.bad += 1
            }
            page.on('request', (request) => {
              const host = new URL(request.url()).host
              if (!AMAP.test(host)) return
              sent[host] = (sent[host] || 0) + 1
              const referer = request.headers()['referer']
              if (referer) referers.add(new URL(referer).origin)
            })
            page.on('response', async (response) => {
              const url = response.url()
              if (AMAP.test(new URL(url).host)) {
                note(url, response.status())
                const type = response.headers()['content-type'] || ''
                // 图片与字体不抄：二进制会把日志搞脏，答案也不在那里。
                if (bodies.length < 4 && /json|javascript|text/i.test(type)) {
                  try {
                    // 公开仓的 Actions 日志谁都能读，瓦片票（auth_key）虽然会过期也别写进去。
              const text = (await response.text()).replace(/auth_key=[^"&\\\s]+/g, 'auth_key=<redacted>').replace(/\s+/g, ' ').slice(0, 220)
                    bodies.push(`${new URL(url).host} ${response.status()} ${text}`)
                    const loaded = text.match(/_jsload_\('(\w+)'/)
                    if (loaded) renderers.add(loaded[1])
                  } catch {
                    bodies.push(`${new URL(url).host} ${response.status()} <body unreadable>`)
                  }
                }
              }
              if (!TILE.test(url)) return
              tiles.asked += 1
              if (response.status() === 200) tiles.ok += 1
              else {
                tiles.bad += 1
                if (!tiles.firstBad) tiles.firstBad = `${response.status()} ${response.url().slice(0, 160)}`
              }
            })
            page.on('requestfailed', (request) => {
              if (!TILE.test(request.url())) return
              tiles.asked += 1
              tiles.failed += 1
              if (!tiles.firstBad) tiles.firstBad = `failed ${request.url().slice(0, 160)}`
            })
            try {
              await page.goto('http://127.0.0.1:4177/map/', { waitUntil: 'domcontentloaded', timeout: 60000 })
              // SDK 降级成 DomRender 时缺的是哪一项能力：页面还活着时就采，别等关掉再问。
              glInfo = await page.evaluate(() => {
                const out = {}
                try {
                  const canvas = document.createElement('canvas')
                  const ctx = canvas.getContext('webgl2') || canvas.getContext('webgl')
                  out.has = Boolean(ctx)
                  if (ctx) {
                    out.version = ctx.getParameter(ctx.VERSION)
                    out.maxTexture = ctx.getParameter(ctx.MAX_TEXTURE_SIZE)
                    const info = ctx.getExtension('WEBGL_debug_renderer_info')
                    out.unmasked = info ? String(ctx.getParameter(info.UNMASKED_RENDERER_WEBGL)).slice(0, 90) : 'no-ext'
                    out.attrs = ctx.getContextAttributes ? JSON.stringify(ctx.getContextAttributes()) : 'n/a'
                    out.caveat = Boolean(canvas.getContext('webgl2', { failIfMajorPerformanceCaveat: true }))
                  }
                } catch (error_) {
                  out.error = error_ && error_.message
                }
                out.ua = navigator.userAgent.slice(0, 160)
                return out
              }).catch((error_) => ({ error: error_ && error_.message }))
              // 要等的是「首屏真的画出来了」，不是「层级容器挂上了」：高德 SDK 本体能加载、
              // 但瓦片与样式域拿不到时 .amap-layers 照样是 1，而画布仍是 inert + opacity 0。
              // 所以看 MapApp 自己的就绪信号：inert 去掉、opacity 回到 1。
              for (let i = 0; i < 30; i += 1) {
                seen = await page.evaluate(() => {
                  const canvas = document.querySelector('.tc-mapapp-canvas')
                  if (!canvas) return 'no-canvas'
                  const opacity = getComputedStyle(canvas).opacity
                  if (canvas.hasAttribute('inert') || opacity === '0') {
                    const failed = /地图加载失败/.test(document.body.innerText)
                    // amap 是 sdk 有没有加载出来：失败但 sdk 在 = 运行时/渲染问题；
                    // 失败且 sdk 不在 = 脚本本身没到（网络或超时）。
                    return `inert=${canvas.hasAttribute('inert')} opacity=${opacity} failed=${failed} amap=${typeof window.AMap}`
                  }
                  return 'ready'
                })
                if (seen === 'ready') {
                  ready = true
                  break
                }
                // 页面已经把失败写出来时，把它抄进日志：这跟「还在加载」是两种不同的原因。
                const message = await page.evaluate(() => {
                  const match = document.body.innerText.match(/地图加载失败：[^\n]*/)
                  return match ? match[0].slice(0, 120) : ''
                })
                if (message) {
                  error = message
                  break
                }
                await page.waitForTimeout(1000)
              }
            } catch (error_) {
              console.log(`probe error: ${error_ && error_.message}`)
            } finally {
              await browser.close()
            }
            console.log(`viewport=${width}x${height} ready=${ready} last=${seen} error=${error}`)
            console.log(`tiles asked=${tiles.asked} ok=${tiles.ok} bad=${tiles.bad} failed=${tiles.failed} first=${tiles.firstBad || 'none'}`)
            // 按域摊开：瓦片零条时，看得出 SDK 走到哪一步（有 webapi/jsapi = 脚本到了没进渲染）。
            const hostRows = Object.keys(hosts).sort().map((host) => `${host}:${hosts[host].ok}/${hosts[host].bad}`)
            console.log(`hosts ${hostRows.length ? hostRows.join(' ') : 'none'}`)
            // 每个域「发了多少 / 回了多少 / 还剩多少没回」，末项非零就是挂住的请求。
            const sentRows = Object.keys(sent).sort().map((host) => {
              const answered = hosts[host] ? hosts[host].ok + hosts[host].bad : 0
              return `${host}:${sent[host]}/${answered}/${sent[host] - answered}`
            })
            console.log(`sent ${sentRows.length ? sentRows.join(' ') : 'none'}`)
            console.log(`referers ${referers.size ? [...referers].join(' ') : 'none'}`)
            console.log(`renderers ${renderers.size ? [...renderers].join(' ') : 'none'}`)
            console.log(`webgl ${JSON.stringify(glInfo).slice(0, 600)}`)

            for (const line of bodies) console.log(`body ${line}`)
            // 零条瓦片响应 = SDK 没发请求（拿票/初始化的问题）；有请求但都不成 = runner 到瓦片域不通；
            // 有 200 但 ready 不开 = 就绪闸本身的问题。三种要分开报，降档理由才站得住。
            process.exit(ready ? 0 : 1)
          })()
          NODE
          rc=$?
          # 探针输出直接落到日志里，排查时不用重跑。
          cat /tmp/probe-map.log || true
          probe_result=$(grep -E '^viewport=' /tmp/probe-map.log | tail -n 1)
          probe_tiles=$(grep -E '^tiles ' /tmp/probe-map.log | tail -n 1)
          probe_hosts=$(grep -E '^hosts ' /tmp/probe-map.log | tail -n 1)
          if [ "$rc" -eq 0 ] && [ "$A11Y_MAP_STATE" = present ]; then
            echo '地图运行时可验证：present 保持' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A11Y_MAP_STATE=absent" >> "$GITHUB_ENV"
            echo "::warning::地图运行时没起来（探针退出码 $rc）：本轮按 absent 跑，地图域断言记不适用，不当成验过"
            {
              echo ''
              echo '### 地图运行时探测'
              echo ''
              echo '| 档 | 探针退出码 | 探测结果 | 瓦片请求 | 高德请求（按域 200/非200） | 结论 |'
              echo '| --- | --- | --- | --- | --- | --- |'
              echo "| \`${{ matrix.viewport }}\` | $rc | \`${probe_result:-无输出}\` | \`${probe_tiles:-无输出}\` | \`${probe_hosts:-无输出}\` | 没起来，降为 absent |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      # sha 是用来对表的，所以写进 job summary（日志要人翻，summary 在 PR 页面上直接可见）。
      # 四档并行会各写一遍同样的表，只在 1440 那个 job 写一次。
      - name: Snapshot provenance
        if: matrix.viewport == '1440x900'
        run: |
          node - <<'NODE'
          const crypto = require('crypto')
          const fs = require('fs')
          const rows = []
          for (const file of ['tools/a11y/spec.cjs', 'tools/a11y/ui-spec.json']) {
            const bytes = fs.readFileSync(file)
            const sha = crypto.createHash('sha256').update(bytes).digest('hex').slice(0, 16)
            const count = file.endsWith('ui-spec.json') ? JSON.parse(bytes.toString('utf8')).checks.length : '—'
            rows.push(`| \`${file}\` | ${bytes.length} | \`${sha}\` | ${count} |`)
            console.log(`${file}\t${bytes.length} bytes\tsha256:${sha}`)
          }
          const summary = [
            '### a11y 快照（CI 跑的就是这两份）',
            '',
            '| 文件 | 字节 | sha256:前16 | 断言数 |',
            '| --- | --- | --- | --- |',
            ...rows,
            '',
            '与 `tools/a11y/README.md` 表里的值不一致，说明快照没重做。',
            '',
          ].join('\n')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n')
          NODE

      - name: Spec at ${{ matrix.viewport }}
        env:
          NODE_PATH: ${{ github.workspace }}/.ci/node_modules
        run: |
          # 上一步的服务若被 runner 收掉，这里就地重启，不让它变成一条「connection refused」的假红。
          if ! curl -fsS http://127.0.0.1:4177/ > /dev/null; then
            nohup setsid node scripts/preview.ts --port 4177 > /tmp/preview.log 2>&1 &
            for attempt in $(seq 1 40); do
              curl -fsS http://127.0.0.1:4177/ > /dev/null && break
              sleep 1
            done
          fi
          mkdir -p reports/a11y
          # absent 分支把「没有 key」显式交给 runner：报告头部写地图状态，地图域断言记不适用。
          args=''
          if [ "$A11Y_MAP_STATE" = absent ]; then args='--no-map'; fi
          node tools/a11y/spec.cjs http://127.0.0.1:4177/map/ tools/a11y/ui-spec.json \
            --viewports ${{ matrix.viewport }} --out reports/a11y --name ${{ matrix.slug }} $args

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-spec-${{ matrix.viewport }}
          path: reports/a11y
          if-no-files-found: warn

  # 不适用白名单闸：地图真掉下来时，断言会从「过」变成「不适用」，在其它 job 里看起来和全绿一模一样。
  # 两条判据分别对应两种路径，别混：
  # - present（有 key）：不适用只允许已知客观缺失（见 tools/a11y/na-budget.cjs 的 ALLOWED），多一条就红。
  # - absent（无 key）：地图域断言本来就会不适用，不参与白名单；但白名单之外仍然一条 NA 都不许多。
  na-budget:
    name: NA budget
    needs: spec
    if: always() && (github.event_name == 'pull_request' || inputs.mode == 'present')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check NA allowlist
        run: node tools/a11y/na-budget.cjs artifacts

  # absent 演练：故意不给 key，跑 1440 与 390 两档，验「地图缺席」那套条数（12 / 13）与 fail=0。
  # 它验的不是地图，是闸本身还认不认得出该有的缺口——地图域或门控漂了，这里第一个红。
  spec-absent:
    name: spec absent (1440 + 390)
    if: github.event_name == 'schedule' || inputs.mode == 'absent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # key 显式留空：这一支要的就是「没有 key」的现实。只要有 key，地图会起来，
      # 12 / 13 那套条数就永远验不到，闸里那条分支也就没人看着。
      - name: Build without map key
        run: |
          echo "A11Y_MAP_STATE=absent" >> "$GITHUB_ENV"
          echo "地图状态：absent（演练，故意不给 key）" >> "$GITHUB_STEP_SUMMARY"
          npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_AMAP_JS_KEY: ''

      - name: Serve out/ on 4177
        run: |
          nohup setsid node scripts/preview.ts --port 4177 > /tmp/preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4177/ > /dev/null; then
              echo "preview up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1

      - name: Install playwright for the spec runner
        run: |
          npm i --no-save --prefix .ci playwright@1.63.0
          # 系统依赖走 apt，runner 侧 DNS 一坏就会卡几分钟甚至挂到超时。
          # 所以给 apt 三分钟上限，装不上只记一条 warning 继续：ubuntu-latest 自带
          # chromium 需要的共享库和常用字体，浏览器本身从 playwright CDN 下，不经 apt。
          timeout 180 .ci/node_modules/.bin/playwright install-deps chromium \
            || echo "::warning::系统依赖没装全（apt 慢或不可达），继续只下浏览器"
          .ci/node_modules/.bin/playwright install chromium

      # 只跑两档：1440 与 390 是不适用条数最多、集合最不一样的两档，375 / 320 各 1 条已由 present 路径覆盖。
      - name: Spec at 1440 and 390 without map
        env:
          NODE_PATH: ${{ github.workspace }}/.ci/node_modules
        run: |
          mkdir -p reports/a11y
          for pair in 1440x900:absent-1440 390x844:absent-390; do
            vp=${pair%%:*}
            name=${pair##*:}
            node tools/a11y/spec.cjs http://127.0.0.1:4177/map/ tools/a11y/ui-spec.json \
              --viewports "$vp" --out reports/a11y --name "$name" --no-map
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-absent
          path: reports/a11y
          if-no-files-found: warn

  na-budget-absent:
    name: NA budget (absent drill)
    needs: spec-absent
    if: always() && (github.event_name == 'schedule' || inputs.mode == 'absent')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: a11y-absent
          path: artifacts

      - name: Check absent drill numbers
        # 演练只跑 1440 + 390：显式声明，缺档才算错。正式 PR 上不带 --viewports，四档一个都不能少。
        run: node tools/a11y/na-budget.cjs artifacts --viewports 1440x900,390x844

  # 演练是 advisory，红了不拦任何人；每周一自动跑一次，红了就是红的，靠看运行不靠开 issue。
  # 2026-11-11 起不再自动开 issue：仓库里只留 PR，不产生由机器人写的问题单。
