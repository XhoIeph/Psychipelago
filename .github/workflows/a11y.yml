name: A11y spec (advisory)

# 设计断言的整站走查，只做参考，不进 required。
# 在 pull_request 上跑：改动合并前就能看见红项；合并后不再重复跑，发布仍由 deploy-pages 负责。
on:
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: spec (${{ matrix.viewport }})
    runs-on: ubuntu-latest
    # 单档约 10 分钟（build 3–4 分钟 + 装 chromium + 跑断言）。这里的 25 分钟是「每个 job 自己的保险丝」，
    # 不是把原来 20 分钟的总门槛放宽：一个 job 只跑一档，保险丝挡的是单档卡死；
    # 四档谁红了谁自己红，不再出现「前几档跑完、后几档被总超时挤掉」的取消。
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - viewport: 1440x900
            slug: ci-1440
          - viewport: 390x844
            slug: ci-390
          - viewport: 375x812
            slug: ci-375
          - viewport: 320x568
            slug: ci-320
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 地图 Key 与 deploy-pages.yml 用同一个仓库 secret。两条路径必须在跑之前分开，不靠「跑了失败再判」：
      # - present（同仓 PR / push）：secret 在。缺了它 lib/amap-loader.ts 直接 reject，页面根本没有 window.AMap，
      #   所以这里 `:?` 硬失败——配置缺了要响，不能静默变成一堆不适用。
      # - absent（fork PR 拿不到 secret）：先定 A11Y_MAP_STATE=absent 并打警告，地图断言按不适用计，
      #   非地图断言照旧全跑且必须全绿。这一支不参与 na-budget 的白名单判定（见文件末尾那个 job）。
      - name: Resolve map key state
        run: |
          if [ -n "${NEXT_PUBLIC_AMAP_JS_KEY:-}" ]; then
            echo "A11Y_MAP_STATE=present" >> "$GITHUB_ENV"
            echo "地图状态：present（key 已注入，地图断言会真跑）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A11Y_MAP_STATE=absent" >> "$GITHUB_ENV"
            echo "地图状态：absent（无 key，地图相关断言记不适用）" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::未拿到 NEXT_PUBLIC_AMAP_JS_KEY（fork PR 或 secret 缺失）：地图断言记不适用，非地图断言照旧全跑"
          fi
        env:
          NEXT_PUBLIC_AMAP_JS_KEY: ${{ secrets.NEXT_PUBLIC_AMAP_JS_KEY }}

      # 这里不设 NEXT_PUBLIC_AMAP_SERVICE_HOST：留空时 bundle 走 127.0.0.1 的 /_AMapService，正由下个 step 的 preview.ts 代跑。
      - name: Build static site
        run: |
          if [ "$A11Y_MAP_STATE" = present ]; then
            : "${NEXT_PUBLIC_AMAP_JS_KEY:?present 分支要求 NEXT_PUBLIC_AMAP_JS_KEY 已注入；secret 缺失就不能假装在验地图}"
          fi
          npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_AMAP_JS_KEY: ${{ secrets.NEXT_PUBLIC_AMAP_JS_KEY }}

      # runner 在步骤结束时可能收掉整个进程组，所以服务要脱离当前会话（nohup + setsid），
      # 否则后面的 step 会撞 connection refused。
      - name: Serve out/ on 4177
        run: |
          nohup setsid node scripts/preview.ts --port 4177 > /tmp/preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4177/ > /dev/null; then
              echo "preview up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "preview did not start"
          cat /tmp/preview.log
          exit 1

      # 断言里凡是等地图容器的都会在 CI 里 15 秒超时。那到底是「出网被挡」还是「加载了但初始化失败」，
      # 只看 note 只能猜。这里把 SDK 域名直接拉一次，把 curl 退出码和 HTTP 状态码写进 summary：
      # curl_exit 6/7/28 = DNS/连接/超时（出网问题）；0 + 200 = 域名可达（问题在运行时或 key 白名单）。
      - name: AMap egress probe
        continue-on-error: true
        run: |
          set +e
          url='https://webapi.amap.com/maps?v=2.0'
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" 2>/tmp/amap-curl.err)
          rc=$?
          err=$(tr '\n' ' ' < /tmp/amap-curl.err | cut -c1-160)
          echo "probe url=$url curl_exit=$rc http_code=$code err=$err"
          {
            echo ''
            echo '### AMap SDK 出网探测'
            echo ''
            echo '| 档 | curl 退出码 | HTTP | 错误 |'
            echo '| --- | --- | --- | --- |'
            echo "| \`${{ matrix.viewport }}\` | $rc | $code | ${err:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install playwright for the spec runner
        run: |
          npm i --no-save --prefix .ci playwright@1.63.0
          .ci/node_modules/.bin/playwright install --with-deps chromium

      # sha 是用来对表的，所以写进 job summary（日志要人翻，summary 在 PR 页面上直接可见）。
      # 四档并行会各写一遍同样的表，只在 1440 那个 job 写一次。
      - name: Snapshot provenance
        if: matrix.viewport == '1440x900'
        run: |
          node - <<'NODE'
          const crypto = require('crypto')
          const fs = require('fs')
          const rows = []
          for (const file of ['tools/a11y/spec.cjs', 'tools/a11y/ui-spec.json']) {
            const bytes = fs.readFileSync(file)
            const sha = crypto.createHash('sha256').update(bytes).digest('hex').slice(0, 16)
            const count = file.endsWith('ui-spec.json') ? JSON.parse(bytes.toString('utf8')).checks.length : '—'
            rows.push(`| \`${file}\` | ${bytes.length} | \`${sha}\` | ${count} |`)
            console.log(`${file}\t${bytes.length} bytes\tsha256:${sha}`)
          }
          const summary = [
            '### a11y 快照（CI 跑的就是这两份）',
            '',
            '| 文件 | 字节 | sha256:前16 | 断言数 |',
            '| --- | --- | --- | --- |',
            ...rows,
            '',
            '与 `tools/a11y/README.md` 表里的值不一致，说明快照没重做。',
            '',
          ].join('\n')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n')
          NODE

      - name: Spec at ${{ matrix.viewport }}
        env:
          NODE_PATH: ${{ github.workspace }}/.ci/node_modules
        run: |
          # 上一步的服务若被 runner 收掉，这里就地重启，不让它变成一条「connection refused」的假红。
          if ! curl -fsS http://127.0.0.1:4177/ > /dev/null; then
            nohup setsid node scripts/preview.ts --port 4177 > /tmp/preview.log 2>&1 &
            for attempt in $(seq 1 40); do
              curl -fsS http://127.0.0.1:4177/ > /dev/null && break
              sleep 1
            done
          fi
          mkdir -p reports/a11y
          # absent 分支把「没有 key」显式交给 runner：报告头部写地图状态，地图域断言记不适用。
          args=''
          if [ "$A11Y_MAP_STATE" = absent ]; then args='--no-map'; fi
          node tools/a11y/spec.cjs http://127.0.0.1:4177/ tools/a11y/ui-spec.json \
            --viewports ${{ matrix.viewport }} --out reports/a11y --name ${{ matrix.slug }} $args

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-spec-${{ matrix.viewport }}
          path: reports/a11y
          if-no-files-found: warn

  # 不适用白名单闸：地图真掉下来时，断言会从「过」变成「不适用」，在其它 job 里看起来和全绿一模一样。
  # 两条判据分别对应两种路径，别混：
  # - present（有 key）：不适用只允许已知客观缺失（见 tools/a11y/na-budget.cjs 的 ALLOWED），多一条就红。
  # - absent（无 key）：地图域断言本来就会不适用，不参与白名单；但白名单之外仍然一条 NA 都不许多。
  na-budget:
    name: NA budget
    needs: spec
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check NA allowlist
        run: node tools/a11y/na-budget.cjs artifacts
