name: 申请撤下内容
description: 指出需要下线的记录
title: '[撤下] '
labels: ['takedown']
body:
  - type: markdown
    attributes:
      value: |
        本 Issue 公开可见。只填写记录编号或页面链接，不提交身份证明、病历或本人就诊关系。
        原因不便公开时，填写“原因不便公开”即可。
  - type: input
    id: target
    attributes:
      label: 涉及的记录
      description: 记录编号或页面链接
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 需要的处理
      options:
        - 下线内容
        - 更正内容
        - 先下线再核对
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 必要说明
    validations:
      required: false
