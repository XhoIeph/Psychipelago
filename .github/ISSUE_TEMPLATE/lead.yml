name: 核对主线线索
description: 提交《就诊地图10.25》中待核对的条目
title: '[线索] '
labels: ['lead']
body:
  - type: markdown
    attributes:
      value: |
        当前唯一主线为 https://www.kdocs.cn/l/crOlzFWeu2GY 。
        请提供文档中的位置与原文，不填写个人隐私。
  - type: input
    id: location
    attributes:
      label: 文档中的位置
      description: 章节、页码或条目名称
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: 原文摘录
      description: 逐字复制相关条目，保留必要上下文
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: 需要核对的内容
    validations:
      required: true
